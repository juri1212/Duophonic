name: Update App Store Listing

# Uploads the listing in appstore/ (text, categories, App Review information and screenshots)
# to App Store Connect. It never uploads a build and never submits for review.
#
# Changes to appstore/ on main are not uploaded on their own; they go out with the next release.
#
# - From the release workflow, on a version tag: creates that version if needed and fills it.
# - By hand (Actions → Update App Store Listing → Run workflow), optionally for a given version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to fill, such as 1.0.1. Empty: the version that is currently editable.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read

# Two uploads at once would race over the same screenshots.
concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  upload:
    name: Upload listing to App Store Connect
    runs-on: ubuntu-latest
    # Uses the same opt-in as the build upload in the release workflow.
    if: ${{ vars.APP_STORE_UPLOAD == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Upload listing
        env:
          VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}  # .p8 contents
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec scripts/upload-app-store-listing.sh "$VERSION"
