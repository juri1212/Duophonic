name: Tests

# macOS runners are scarce, so this runs once per change: on pull requests and on main, not on
# every branch push, and not when only the App Store listing or the docs changed.
on:
  push:
    branches:
      - main
    paths-ignore: &non-code
      - 'appstore/**'
      - 'docs/**'
      - '**/*.md'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/upload-app-store-listing.sh'
      - '.github/workflows/app-store-listing.yml'
  pull_request:
    paths-ignore: *non-code

permissions:
  contents: read

# A new push makes the run for the previous commit of a PR obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit and the end-to-end tests share one runner and one build.
  test:
    name: Unit and end-to-end tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install BlackHole
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          # Core Audio only loads new drivers on start; launchd restarts it.
          sudo killall coreaudiod
          for _ in {1..30}; do
            devices=$(system_profiler SPAudioDataType)
            if grep -q 'BlackHole 2ch' <<<"$devices" && grep -q 'BlackHole 16ch' <<<"$devices"; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::BlackHole devices didn't appear"
          exit 1

      # Without microphone access macOS records silence. The runners have SIP disabled, so
      # the permission can be granted to the test host (the app) directly in the TCC database.
      - name: Grant microphone access
        run: |
          grant="INSERT OR REPLACE INTO access VALUES('kTCCServiceMicrophone',
            'com.juri1212.Duophonic',0,2,3,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s),NULL,NULL,'UNUSED',0);"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$grant"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "$grant"

      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -scheme Duophonic -destination 'platform=macOS' \
            -derivedDataPath DerivedData -quiet \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # The routing tests run on their own below: in parallel they'd play tones into the shared
      # BlackHole devices at the same time.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building -scheme Duophonic -destination 'platform=macOS' \
            -skip-testing:DuophonicTests/AudioRoutingTests \
            -derivedDataPath DerivedData -quiet

      # Runs even when a unit test failed, so one run reports both.
      - name: Run end-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -scheme Duophonic -destination 'platform=macOS' \
            -only-testing:DuophonicTests/AudioRoutingTests -parallel-testing-enabled NO \
            -derivedDataPath DerivedData -resultBundlePath e2e.xcresult -quiet

      # The suite skips itself without BlackHole, which would otherwise pass silently.
      - name: Check nothing was skipped
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          summary=$(xcrun xcresulttool get test-results summary --path e2e.xcresult)
          echo "$summary"
          jq -e '.passedTests >= 3 and .skippedTests == 0' <<<"$summary" >/dev/null
