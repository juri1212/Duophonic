name: Build macOS App and Create Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build for macOS
    runs-on: macos-26
    permissions:
      contents: read
    env:
      APP_PATH: DerivedData/Build/Products/Release/Duophonic.app
      # Optional. When the signing secrets are set, the app is signed with a Developer ID
      # certificate and notarized, so it opens without Gatekeeper warnings. Without them it is
      # signed ad hoc. The secrets themselves are only passed to the steps that use them, so
      # third-party actions never see them.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_APPLE_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}  # base64 encoded .p12
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build app (Release)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_DEVELOPER_ID" = "true" ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application"
              "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" "OTHER_CODE_SIGN_FLAGS=--timestamp")
          else
            SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          VERSIONING=("CURRENT_PROJECT_VERSION=${{ github.run_number }}")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSIONING+=("MARKETING_VERSION=${GITHUB_REF_NAME#v}")
          fi

          xcodebuild -scheme Duophonic -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData -quiet \
            clean build ONLY_ACTIVE_ARCH=NO "${SIGNING[@]}" "${VERSIONING[@]}"

      # Never ship without the protections the project asks for: the sandbox, the hardened
      # runtime, and no debugger attachment.
      - name: Verify code signature
        run: scripts/verify-signature.sh "$APP_PATH"

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}  # app-specific password
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$APP_PATH"

      - name: Package .app as zip
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release/Duophonic.zip
          (cd release && shasum -a 256 Duophonic.zip > Duophonic.zip.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Duophonic
          path: release/*

  release:
    name: Create GitHub release with artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestation, which lets users verify a download came from
      # this workflow: gh attestation verify Duophonic.zip -R juri1212/Duophonic
      id-token: write
      attestations: write
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Duophonic
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Duophonic.zip

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*

  app-store:
    name: Upload to App Store Connect
    runs-on: macos-26
    permissions:
      contents: read
    # Opt in with the repository variable APP_STORE_UPLOAD=true once the App Store secrets are
    # set. The build lands in TestFlight; submitting it for review stays a manual step.
    if: ${{ github.ref_type == 'tag' && vars.APP_STORE_UPLOAD == 'true' }}
    env:
      ARCHIVE_PATH: Duophonic.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Import App Store certificates and provisioning profile
        env:
          # base64 encoded .p12 with both the Apple Distribution and the Mac Installer
          # Distribution certificate
          MAS_CERTIFICATES_P12: ${{ secrets.MAS_CERTIFICATES_P12 }}
          MAS_CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}  # base64 encoded
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" \
            -P "$MAS_CERTIFICATES_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificates.p12"

          PROFILE="$RUNNER_TEMP/profile.provisionprofile"
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.provisionprofile"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      # The build number is this workflow's run number, so it matches the GitHub release built
      # from the same tag and always increases, as App Store Connect requires.
      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -scheme Duophonic -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData \
            -archivePath "$ARCHIVE_PATH" -quiet archive \
            CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" \
            "CURRENT_PROJECT_VERSION=${{ github.run_number }}" "MARKETING_VERSION=${GITHUB_REF_NAME#v}"

      - name: Verify code signature
        run: scripts/verify-signature.sh "$ARCHIVE_PATH/Products/Applications/Duophonic.app" --app-store

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}  # .p8 contents
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.juri1212.Duophonic</key><string>$PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          rm "$KEY_PATH"
